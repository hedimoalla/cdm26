<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <clipPath id="b">
      <circle cx="16" cy="16" r="12.5"/>
    </clipPath>
    <radialGradient id="g" cx="42%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#dde6f5"/>
    </radialGradient>
    <radialGradient id="bg" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#0d1a35"/>
      <stop offset="100%" stop-color="#060d1f"/>
    </radialGradient>
  </defs>

  <!-- Dark background circle -->
  <circle cx="16" cy="16" r="16" fill="url(#bg)"/>

  <!-- Gold ring -->
  <circle cx="16" cy="16" r="14.2" fill="none" stroke="#c9a227" stroke-width="1.4"/>

  <!-- Ball base with subtle gradient for depth -->
  <circle cx="16" cy="16" r="12.5" fill="url(#g)"/>

  <!-- Soccer patches clipped to ball, dark navy matching app theme -->
  <g clip-path="url(#b)" fill="#0d1835" opacity="0.92">
    <!-- Top-centre pentagon -->
    <polygon points="16,4.5  20.6,8.2  19.0,13.5  13.0,13.5  11.4,8.2"/>
    <!-- Upper-right patch -->
    <polygon points="20.6,8.2  26.8,7.5  29.0,14.0  24.8,18.2  19.0,13.5"/>
    <!-- Right patch -->
    <polygon points="24.8,18.2  29.0,14.0  29.5,21.2  25.8,25.8  21.2,23.0"/>
    <!-- Bottom-right patch -->
    <polygon points="21.2,23.0  25.8,25.8  23.2,29.5  16.5,29.5  13.0,26.2"/>
    <!-- Bottom-left patch -->
    <polygon points="7.0,18.2  11.0,22.8  13.0,26.2  7.5,25.8  3.0,21.2"/>
    <!-- Upper-left patch -->
    <polygon points="3.0,14.0  5.2,7.5  11.4,8.2  13.0,13.5  7.2,18.2"/>
  </g>

  <!-- Ball edge — subtle inner shadow -->
  <circle cx="16" cy="16" r="12.5" fill="none" stroke="#1a2d52" stroke-width="0.8"/>

  <!-- Specular highlight -->
  <ellipse cx="12.5" cy="10.5" rx="3.5" ry="2.2" fill="white" opacity="0.28" transform="rotate(-20 12.5 10.5)"/>
</svg>
